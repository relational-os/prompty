version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "5173:5173"
    environment:
      - DATABASE_PATH=/app/data/prompty.db
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - PORT=3000
    volumes:
      - ./data:/app/data
    restart: unless-stopped